<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Take Attendance</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#e8f5e9;
    margin:0;
    padding:30px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

h1{
    color:#2e7d32;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#2e7d32;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.btn{
    background:#2e7d32;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.btn:hover{
    background:#1b5e20;
}

select,
input[type=date]{
    padding:10px;
    margin:10px 0;
}

</style>

</head>

<body>

<div class="container">

<h1>Take Attendance</h1>

<!-- LOAD STUDENTS FORM -->
<form method="GET">

<label><strong>Select Class</strong></label><br>

<select name="class" required>

<option value="">-- Select Class --</option>

{% for c in classes %}

<option value="{{ c.id }}"
{% if selected_class and selected_class.id == c.id %}selected{% endif %}>
{{ c.class_name }}
</option>

{% endfor %}

</select>

<button class="btn" type="submit">
Load Students
</button>

</form>

{% if students %}

<hr>

<!-- SAVE ATTENDANCE FORM -->
<form method="POST">

{% csrf_token %}

<input type="hidden" name="class" value="{{ selected_class.id }}">

<label><strong>Date</strong></label><br>

<input
type="date"
name="attendance_date"
value="{{ today|date:'Y-m-d' }}"
required>

<table>

<tr>
<th>Student</th>
<th>Present</th>
<th>Absent</th>
<th>Late</th>
</tr>

{% for student in students %}

<tr>

<td>
{{ student.first_name }} {{ student.last_name }}
</td>

<td>
<input
type="radio"
name="status_{{ student.id }}"
value="Present"
checked>
</td>

<td>
<input
type="radio"
name="status_{{ student.id }}"
value="Absent">
</td>

<td>
<input
type="radio"
name="status_{{ student.id }}"
value="Late">
</td>

</tr>

{% endfor %}

</table>

<br>

<button class="btn" type="submit">
Save Attendance
</button>

</form>

{% endif %}

</div>

</body>
</html>
