<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Delete Fee Payment</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#e8f5e9;
    margin:0;
    padding:30px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

h1{
    color:#d32f2f;
}

p{
    font-size:18px;
    margin:25px 0;
}

.btn{
    display:inline-block;
    padding:12px 20px;
    text-decoration:none;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
}

.delete{
    background:#d32f2f;
}

.delete:hover{
    background:#b71c1c;
}

.cancel{
    background:#757575;
    margin-left:10px;
}

.cancel:hover{
    background:#555;
}

</style>

</head>

<body>

<div class="container">

<h1>Delete Fee Payment</h1>

<p>
Are you sure you want to delete the fee record for
<strong>{{ fee.student }}</strong>?
</p>

<form method="POST">

{% csrf_token %}

<button type="submit" class="btn delete">
Yes, Delete
</button>

<a href="{% url 'fee-list' %}" class="btn cancel">
Cancel
</a>

</form>

</div>

</body>
</html>
