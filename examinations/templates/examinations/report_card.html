{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Report Card</h2>
    <div class="card p-4">
        <h4>Student Name</h4>
        <p><strong>Class:</strong> </p>
        <p><strong>Term:</strong> </p>
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Score</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                {% for score in scores %}
                <tr>
                    <td>{{ score.subject }}</td>
                    <td>{{ score.score }}</td>
                    <td>{{ score.grade }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center">No scores available.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
