{% extends "base.html" %}

{% block title %}Add Examination{% endblock %}

{% block page_title %}Add Examination Result{% endblock %}

{% block content %}

<style>
.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    max-width:700px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.btn{
    background:#2e7d32;
    color:white;
    padding:10px 18px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:20px;
}

.btn:hover{
    background:#1b5e20;
}
</style>

<div class="card">

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn">
        Save Result
    </button>

</form>

</div>

{% endblock %}
