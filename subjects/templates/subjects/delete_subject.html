{% extends "base.html" %}

{% block title %}Delete Subject{% endblock %}

{% block page_title %}Delete Subject{% endblock %}

{% block content %}

<style>

.card{
    background:white;
    max-width:600px;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.btn{
    padding:10px 18px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.delete{
    background:#d32f2f;
}

.cancel{
    background:#757575;
    text-decoration:none;
    padding:10px 18px;
    border-radius:5px;
    color:white;
}

</style>

<div class="card">

<h3>Delete Subject</h3>

<p>

Are you sure you want to delete

<strong>{{ subject.subject_name }}</strong>?

</p>

<form method="POST">

{% csrf_token %}

<button class="btn delete" type="submit">
Delete
</button>

<a href="{% url 'subject-list' %}" class="cancel">
Cancel
</a>

</form>

</div>

{% endblock %}
