{% extends "base.html" %}

{% block title %}Delete Teacher{% endblock %}

{% block page_title %}
Delete Teacher
{% endblock %}

{% block content %}

<style>

.card{
    background:white;
    max-width:500px;
    margin:auto;
    padding:30px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.buttons{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:15px;
}

.btn-danger{
    background:#d32f2f;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.btn-secondary{
    background:#777;
    color:white;
    padding:12px 20px;
    border-radius:5px;
    text-decoration:none;
}

</style>

<div class="card">

<h2>Delete Teacher</h2>

<p>
Are you sure you want to delete
<strong>{{ teacher.first_name }} {{ teacher.last_name }}</strong>?
</p>

<form method="POST">

{% csrf_token %}

<div class="buttons">

<button class="btn-danger" type="submit">
Delete
</button>

<a href="{% url 'teacher-list' %}" class="btn-secondary">
Cancel
</a>

</div>

</form>

</div>

{% endblock %}
